name: Deploy RINGS online prototype

on:
  push:
    branches:
      - preview/online
    paths:
      - "prototypes/workspace-recovery/**"
      - ".github/workflows/deploy-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: rings-online-preview
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload recovery workspace
        uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/workspace-recovery

      - name: Deploy online prototype
        id: deployment
        uses: actions/deploy-pages@v4
